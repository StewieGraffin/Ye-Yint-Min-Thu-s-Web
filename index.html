```html
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            color: #22c55e;
        }

        .score {
            font-size: 24px;
            margin-bottom: 15px;
        }

        canvas {
            background: #1f2937;
            border: 4px solid #22c55e;
            border-radius: 8px;
            display: block;
            margin: auto;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }

        .controls {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 5px;
            justify-content: center;
        }

        .controls button {
            margin: 0;
            padding: 15px;
            font-size: 20px;
        }

        .up {
            grid-column: 2;
        }

        .left {
            grid-column: 1;
            grid-row: 2;
        }

        .down {
            grid-column: 2;
            grid-row: 2;
        }

        .right {
            grid-column: 3;
            grid-row: 2;
        }

        #message {
            margin-top: 15px;
            font-size: 20px;
            color: #f87171;
            min-height: 25px;
        }
    </style>
</head>

<body>

<div class="game-container">

    <h1>🐍 Snake Game</h1>

    <div class="score">
        Score: <span id="score">0</span>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div id="message"></div>

    <button onclick="restartGame()">Restart</button>

    <div class="controls">
        <button class="up" onclick="changeDirection('up')">⬆️</button>
        <button class="left" onclick="changeDirection('left')">⬅️</button>
        <button class="down" onclick="changeDirection('down')">⬇️</button>
        <button class="right" onclick="changeDirection('right')">➡️</button>
    </div>

</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const box = 20;
    const canvasSize = 400;

    let snake;
    let food;
    let direction;
    let nextDirection;
    let score;
    let game;

    function startGame() {
        snake = [
            { x: 200, y: 200 },
            { x: 180, y: 200 },
            { x: 160, y: 200 }
        ];

        direction = "right";
        nextDirection = "right";
        score = 0;

        document.getElementById("score").textContent = score;
        document.getElementById("message").textContent = "";

        createFood();

        clearInterval(game);
        game = setInterval(drawGame, 100);
    }

    function drawGame() {
        direction = nextDirection;

        ctx.fillStyle = "#1f2937";
        ctx.fillRect(0, 0, canvasSize, canvasSize);

        // 食べ物
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(food.x, food.y, box, box);

        // 蛇
        snake.forEach((part, index) => {
            ctx.fillStyle = index === 0 ? "#22c55e" : "#4ade80";
            ctx.fillRect(part.x, part.y, box, box);

            ctx.strokeStyle = "#166534";
            ctx.strokeRect(part.x, part.y, box, box);
        });

        let head = {
            x: snake[0].x,
            y: snake[0].y
        };

        if (direction === "W") {
            head.y -= box;
        }

        if (direction === "S") {
            head.y += box;
        }

        if (direction === "A") {
            head.x -= box;
        }

        if (direction === "D") {
            head.x += box;
        }

        // 壁に衝突
        if (
            head.x < 0 ||
            head.y < 0 ||
            head.x >= canvasSize ||
            head.y >= canvasSize
        ) {
            gameOver();
            return;
        }

        // 自分自身に衝突
        for (let i = 0; i < snake.length; i++) {
            if (
                head.x === snake[i].x &&
                head.y === snake[i].y
            ) {
                gameOver();
                return;
            }
        }

        snake.unshift(head);

        // 食べ物を食べた
        if (
            head.x === food.x &&
            head.y === food.y
        ) {
            score++;
            document.getElementById("score").textContent = score;
            createFood();
        } else {
            snake.pop();
        }
    }

    function createFood() {
        food = {
            x: Math.floor(Math.random() * (canvasSize / box)) * box,
            y: Math.floor(Math.random() * (canvasSize / box)) * box
        };

        // 蛇と食べ物が重ならないようにする
        for (let part of snake) {
            if (part.x === food.x && part.y === food.y) {
                createFood();
                return;
            }
        }
    }

    function changeDirection(newDirection) {

        if (newDirection === "up" && direction !== "down") {
            nextDirection = "up";
        }

        if (newDirection === "down" && direction !== "up") {
            nextDirection = "down";
        }

        if (newDirection === "left" && direction !== "right") {
            nextDirection = "left";
        }

        if (newDirection === "right" && direction !== "left") {
            nextDirection = "right";
        }
    }

    function gameOver() {
        clearInterval(game);

        document.getElementById("message").textContent =
            "💥 Game Over!";

        // 少し遅れて再スタート可能
    }

    function restartGame() {
        startGame();
    }

    // キーボード操作
    document.addEventListener("keydown", function(event) {

        if (event.key === "ArrowUp") {
            changeDirection("up");
        }

        if (event.key === "ArrowDown") {
            changeDirection("down");
        }

        if (event.key === "ArrowLeft") {
            changeDirection("left");
        }

        if (event.key === "ArrowRight") {
            changeDirection("right");
        }
    });

    // ゲーム開始
    startGame();
</script>

</body>
</html>
