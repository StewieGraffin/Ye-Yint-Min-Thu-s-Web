```html
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>クリックゲーム</title>

    <style>

        /* 全体 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, "Yu Gothic", sans-serif;
            background: #e8f5e9;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        /* ゲーム画面 */
        .game {
            width: 600px;
            max-width: 90%;

            background: white;
            padding: 40px;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        /* タイトル */
        h1 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .description {
            margin-bottom: 30px;
            color: #555;
        }

        /* ゲームエリア */
        .game-area {
            position: relative;

            height: 300px;

            background: #f1f8e9;

            border: 3px solid #81c784;

            border-radius: 15px;

            overflow: hidden;
        }

        /* 説明 */
        .start-message {
            margin-top: 30px;
            font-size: 18px;
            color: #555;
        }

        /* チェックボックスを非表示 */
        input {
            display: none;
        }

        /* ターゲットボタン */
        .target {
            position: absolute;

            top: 120px;
            left: 250px;

            width: 70px;
            height: 70px;

            background: #e53935;

            border-radius: 50%;

            cursor: pointer;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-size: 30px;
            font-weight: bold;

            transition: 0.2s;
        }

        /* クリックしたらターゲットを消す */
        #hit:checked ~ .game-area .target {
            display: none;
        }

        /* クリック後のメッセージ */
        #hit:checked ~ .game-area .success {
            display: block;
        }

        .success {
            display: none;

            position: absolute;

            top: 110px;
            left: 0;
            right: 0;

            color: #2e7d32;

            font-size: 28px;
            font-weight: bold;
        }

        /* リスタート */
        .restart {
            display: inline-block;

            margin-top: 25px;

            padding: 12px 30px;

            background: #2e7d32;
            color: white;

            text-decoration: none;

            border-radius: 8px;

            font-weight: bold;
        }

        .restart:hover {
            background: #1b5e20;
        }

        /* ルール */
        .rules {
            margin-top: 25px;

            padding: 15px;

            background: #fffde7;

            border-radius: 10px;

            color: #555;
        }

    </style>
</head>

<body>

    <div class="game">

        <h1>🎯 クリックゲーム</h1>

        <p class="description">
            赤いボタンをクリックしよう！
        </p>

        <!-- ゲーム開始用 -->
        <input type="checkbox" id="hit">

        <div class="game-area">

            <!-- ターゲット -->
            <label for="hit" class="target">
                ●
            </label>

            <!-- 成功メッセージ -->
            <div class="success">
                🎉 HIT! 🎉
            </div>

        </div>

        <p class="start-message">
            赤い丸をクリックしてゲームクリア！
        </p>

        <!-- リセット -->
        <a href="" class="restart">
            🔄 もう一度遊ぶ
        </a>

        <div class="rules">
            <strong>ゲームルール</strong>
            <br>
            赤いターゲットをクリックするとクリアです！
        </div>

    </div>

</body>
</html>
